services:
  yowking-dev:
    image: zen:5000/yowking:latest
    container_name: yowking-dev
    environment:
      - NATS_TOKEN=${NATS_TOKEN}
      - NATS_URL=nats:4222
      - SHOULD_LOG_ENGINE=${SHOULD_LOG_ENGINE}
      - SHOULD_POST_INPUT=${SHOULD_POST_INPUT}
    volumes:
      - cal45:/opt/yowking/calibrations
    networks:
      - yow
    restart: unless-stopped

  yowking-nt:
    image: yowking-nt:latest
    environment:
      - NATS_URL=nats://zen:4222
      - WORKER_TAG=kingNT
    env_file:
      - env/king.env
    restart: unless-stopped

networks:
  yow:
    external: true

volumes:
  cal45:
    external: true
