services:
    yowking-rnd0-23:
      image: zen:5000/yowking:prod-rnd0
      cpus: 2
      cpuset: "2,3"
      pids_limit: 8192
      environment:
        - WORKER_TAG=zenRnd0
        - FORCE_RANDOM_OFF=true
      volumes:
        - cal45:/opt/yowking/calibrations
      env_file: 
        - env/king.env
      container_name: yowking-rnd0-23
      networks:
        - yow
      restart: always
