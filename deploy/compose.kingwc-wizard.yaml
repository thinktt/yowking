name: kingwc-wizard

services:
  worker:
    image: zen:5000/yowking-nt:kingwc
    environment:
      NATS_URL: nats://zen:4222
      WORKER_TAG: kingWCWizard
      ENGINE_MOVE_TIMEOUT: ${ENGINE_MOVE_TIMEOUT:-15m}
    env_file:
      - env/king.env
    volumes:
      - ./clockTimes.kingwc-wizard.json:/opt/yowking/calibrations/clockTimes.json:ro
    pids_limit: 256
    restart: unless-stopped
