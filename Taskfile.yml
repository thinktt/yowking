version: "3"

dotenv:
  - .env

vars:
  DEPS_IMAGE: "yowdeps"
  MAIN_IMAGE_LOCAL: "zen:5000/yowking:latest"
  KING_NT_IMAGE: "zen:5000/yowking-nt:test3"
  KING_NT_BASE_IMAGE: "yowking-worker-routing:latest"
  KING_NT_ENGINE: "../arena-runner/engine-patching/fake-clock/work/TheKing350-fakeclock-idDiv1000ns.exe"
  KING_NT_CLOCKS: "../arena-runner/engine-patching/fake-clock/calibration/out/hard-idDiv1000ns-scale55-pass1/clockTimes.json"
  KING_NT_WORKERS: 8
  KING_NT_HALF_WORKERS: 8
  KING_NT_QUARTER_WORKERS: 8
  KING_DIV1_TEST5_IMAGE: "zen:5000/yowking-nt:div1-test5"
  KING_DIV1_TEST5_ENGINE: "../arena-runner/engine-patching/fake-clock/work/TheKing350-fakeclock-div1.exe"
  KING_DIV1_TEST5_CLOCKS: "../arena-runner/engine-patching/fake-clock/calibration/out/hard-div1-refined/clockTimes.json"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list --sort none

  import:cm:
    desc: Step 1 - Import Chessmaster assets from CM_DIR into assets/cm
    cmds:
      - echo "CM_DIR=${CM_DIR}"
      - test -n "${CM_DIR}"
      - mkdir -p assets/cm/books
      - mkdir -p assets/cm/personalities
      - cp "${CM_DIR}/TheKing350.exe" assets/cm/TheKing350.exe
      - cp -r "${CM_DIR}/Data/Opening Books/"* assets/cm/books/
      - cp -r "${CM_DIR}/Data/Personalities/"* assets/cm/personalities/
      - cd assets/cm/personalities && rm -f *#*
      - cd assets/cm/personalities && mv "Josh - Age 6.CMP" "Josh6.CMP" || true
      - cd assets/cm/personalities && mv "Josh - Age 7.CMP" "Josh7.CMP" || true
      - cd assets/cm/personalities && mv "Josh - Age 8.CMP" "Josh8.CMP" || true
      - cd assets/cm/personalities && mv "Josh - Age 9.CMP" "Josh9.CMP" || true
      - cd assets/cm/personalities && mv "Josh - Age 12.CMP" "Josh12.CMP" || true
      - >
        bash -lc 'hash=$(md5sum assets/cm/personalities/* | awk "{ print \$1 }" | md5sum | head -c 32);
        echo "personalities folder check";
        echo "correct hash: d3ef7f9453b372e094bac18ce262b442";
        echo "actual hash : $hash"'
    
  build:dist:
    desc: Step 2 - Build full runtime dist/ (deps artifacts + calibrations + Go binaries)
    cmds:
      - docker build -f Dockerfile.dist -t {{.DEPS_IMAGE}} .
      - rm -rf dist
      - docker rm -f yowdeps-build || true
      - docker run --name yowdeps-build {{.DEPS_IMAGE}} ./scripts/build-all.sh
      - docker cp yowdeps-build:/build/dist ./dist
      - docker rm yowdeps-build
      - mkdir -p dist/calibrations
      - cp assets/devClockTimes.json dist/calibrations/clockTimes.json
      - cp -r fixtures dist/fixtures
      - task gobuild

  build:image:
    desc: Step 3 - Build the main yowking container image
    cmds:
      - docker rm yowking || true
      - docker image rm {{.MAIN_IMAGE_LOCAL}} || true
      - docker build -t {{.MAIN_IMAGE_LOCAL}} .

  build:nt:dist:
    desc: Build dist/ with the KingNT engine and hard-bot calibration
    cmds:
      - task gobuild
      - test -f {{.KING_NT_ENGINE}}
      - test -f {{.KING_NT_CLOCKS}}
      - cp {{.KING_NT_ENGINE}} dist/TheKing350.exe
      - cp {{.KING_NT_CLOCKS}} dist/calibrations/clockTimes.json

  build:nt:image:
    desc: Build the KingNT worker image
    deps: [build:nt:dist]
    cmds:
      - docker build --build-arg BASE_IMAGE={{.KING_NT_BASE_IMAGE}} -f Dockerfile.nt -t {{.KING_NT_IMAGE}} .

  publish:nt:test3:
    desc: Build and publish the reproducible Test 3 worker image to Zen
    deps: [build:nt:image]
    cmds:
      - docker push {{.KING_NT_IMAGE}}

  build:nt:test5:
    desc: "Build the div1 Test 5 worker image from the refined Hard calibration."
    cmds:
      - task gobuild
      - test -f {{.KING_DIV1_TEST5_ENGINE}}
      - test -f {{.KING_DIV1_TEST5_CLOCKS}}
      - cp {{.KING_DIV1_TEST5_ENGINE}} dist/TheKing350.exe
      - cp {{.KING_DIV1_TEST5_CLOCKS}} dist/calibrations/clockTimes.json
      - docker build --build-arg BASE_IMAGE={{.KING_NT_BASE_IMAGE}} -f Dockerfile.nt -t {{.KING_DIV1_TEST5_IMAGE}} .

  publish:nt:test5:
    desc: "Build and publish the div1 Test 5 worker image to Zen."
    deps: [build:nt:test5]
    cmds:
      - docker push {{.KING_DIV1_TEST5_IMAGE}}

  deploy:test3:bee:
    desc: Start eight unrestricted Test 3 workers on Bee tagged kingNT
    cmds:
      - WORKER_TAG=kingNT docker compose --project-name yowking -f deploy/compose.test3.yaml up -d --scale nt={{.KING_NT_WORKERS}} nt

  deploy:test3:bee:down:
    desc: Stop and remove Bee Test 3 workers
    cmds:
      - docker compose --project-name yowking -f deploy/compose.test3.yaml stop nt
      - docker compose --project-name yowking -f deploy/compose.test3.yaml rm -f nt

  deploy:test5:bee:
    desc: "Deploy eight unrestricted div1 Test 5 workers on Bee. Does not start the arena campaign."
    cmds:
      - docker compose --project-name yowking -f deploy/compose.test3.yaml stop nt nt-quarter || true
      - docker compose --project-name yowking -f deploy/compose.test3.yaml rm -f nt nt-quarter || true
      - docker compose --project-name yowking -f deploy/compose.test5.yaml up -d --scale nt={{.KING_NT_WORKERS}} nt

  deploy:test5:bee:down:
    desc: "Stop and remove Bee Test 5 div1 workers."
    cmds:
      - docker compose --project-name yowking -f deploy/compose.test5.yaml stop nt
      - docker compose --project-name yowking -f deploy/compose.test5.yaml rm -f nt

  deploy:test4:bee:
    desc: Replace Bee Test 3 workers with eight quarter-CPU Test 4 workers
    cmds:
      - docker compose --project-name yowking -f deploy/compose.test3.yaml stop nt
      - docker compose --project-name yowking -f deploy/compose.test3.yaml rm -f nt
      - docker compose --project-name yowking -f deploy/compose.test3.yaml up -d --scale nt-quarter={{.KING_NT_QUARTER_WORKERS}} nt-quarter

  deploy:test4:bee:down:
    desc: Stop and remove Bee Test 4 quarter-CPU workers
    cmds:
      - docker compose --project-name yowking -f deploy/compose.test3.yaml stop nt-quarter
      - docker compose --project-name yowking -f deploy/compose.test3.yaml rm -f nt-quarter
  
  deploy:
    desc: Step 4 - Deploy one dev worker (only one for now)
    cmds:
      - task deploy:dev

  dexi:
    desc: For dev workflow, rebuild go binaries, rebuild container, run interactively
    deps: [gobuild, build:image]
    cmds:
       - docker compose --env-file .env -f deploy/compose.dev.yaml up --force-recreate yowking-dev

  din:
    desc: Similar to dexi but shell into the container for troubleshooting
    deps: [gobuild, build:image]
    cmds:
      - docker compose --env-file .env -f deploy/compose.dev.yaml up -d --force-recreate yowking-dev
      - docker exec -it yowking-dev ash

  gobuild:
    desc: Build enginewrap and kingworker binaries into dist/
    cmds:
      - GOOS=windows GOARCH=386 go build -o dist/enginewrap.exe ./cmd/enginewrap
      - GOOS=linux CGO_ENABLED=0 go build -o dist/kingworker ./cmd/kingworker
      - GOOS=linux CGO_ENABLED=0 go build -o dist/kingctl ./cmd/kingctl

  deploy:dev:
    desc: Start one dev yowking worker from deploy/compose.dev.yaml
    cmds:
      - docker compose --env-file .env -f deploy/compose.dev.yaml up -d

  deploy:dev:down:
    desc: Stop the dev yowking worker compose stack
    cmds:
      - docker compose --env-file .env -f deploy/compose.dev.yaml down

  deploy:nt:
    desc: Start eight KingNT workers tagged kingNT against Zen NATS
    deps: [build:nt:image]
    cmds:
      - docker compose --project-name yowking -f deploy/compose.nt.yaml up -d --scale nt={{.KING_NT_WORKERS}}

  deploy:nt:down:
    desc: Stop the KingNT worker test containers
    cmds:
      - docker compose --project-name yowking -f deploy/compose.nt.yaml down

  deploy:nt:half:
    desc: Start eight half-CPU KingNT workers tagged kingNTHalf
    cmds:
      - docker compose --project-name yowking -f deploy/compose.nt.yaml up -d --scale yowking-nt-half-cpu={{.KING_NT_HALF_WORKERS}} yowking-nt-half-cpu

  deploy:nt:half:down:
    desc: Stop the half-CPU KingNT workers
    cmds:
      - docker compose --project-name yowking -f deploy/compose.nt.yaml stop yowking-nt-half-cpu
      - docker compose --project-name yowking -f deploy/compose.nt.yaml rm -f yowking-nt-half-cpu

  depin:
    desc: For troubleshooting the dependency builder container, start deps container, exec in
    cmds:
      - docker rm -f yowdeps-build || true
      - docker run -d --name yowdeps-build {{.DEPS_IMAGE}} sleep infinity
      - docker exec -it yowdeps-build ash
  
  clean:all:
    desc: Remove dist, generated compose files, imported CM assets, and helper build image/container
    deps: [clean:compose, clean:dist, clean:cm, clean:images]
  
  clean:compose:
    desc: Remove generated compose files
    cmds:
      - rm -f deploy/compose.yowking.yaml

  clean:dist:
    desc: Remove root dist/ and generated compose files
    cmds:
      - rm -rf dist
      - rm -f deploy/compose.yowking.yaml

  clean:cm:
    desc: Remove imported Chessmaster assets (assets/cm)
    cmds:
      - rm -rf assets/cm

  clean:images:
    desc: Remove local build helper image/container
    cmds:
      - docker rm -f yowdeps-build || true
      - docker rmi {{.DEPS_IMAGE}} || true
